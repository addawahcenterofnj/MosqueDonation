<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#1a472a"/>
  
  <!-- Subtle geometric pattern -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#2d6a4f" stroke-width="1.5" opacity="0.5"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#2d6a4f" stroke-width="1" opacity="0.3"/>

  <!-- Mosque dome -->
  <path d="M256 130 C200 130 165 170 165 210 L347 210 C347 170 312 130 256 130Z" fill="#f0c040"/>
  
  <!-- Dome top crescent -->
  <circle cx="256" cy="118" r="18" fill="#f0c040"/>
  <circle cx="266" cy="112" r="14" fill="#1a472a"/>
  <!-- Star -->
  <polygon points="256,95 259,105 270,105 261,111 264,122 256,116 248,122 251,111 242,105 253,105" fill="#f0c040"/>

  <!-- Minaret left -->
  <rect x="148" y="175" width="22" height="90" rx="4" fill="#d4a017"/>
  <path d="M148 175 L159 150 L170 175Z" fill="#f0c040"/>
  <circle cx="159" cy="148" r="5" fill="#f0c040"/>

  <!-- Minaret right -->
