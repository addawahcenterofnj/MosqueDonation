name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sS --fail \
            "https://hkotzaaulausoreqmasn.supabase.co/rest/v1/donors?select=phone&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
