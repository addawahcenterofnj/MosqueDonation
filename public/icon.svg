  <rect x="120" y="342" width="272" height="10" rx="3" fill="#9a7209"/>

  <!-- Donation coin -->
  <circle cx="390" cy="360" r="42" fill="#f0c040" stroke="#d4a017" stroke-width="3"/>
  <circle cx="390" cy="360" r="34" fill="#f5d060"/>
  <text x="390" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1a472a">$</text>
  <!-- Small heart -->
  <path d="M382 345 C382 342 378 340 376 343 C374 340 370 342 370 345 C370 349 376 354 376 354 C376 354 382 349 382 345Z" fill="#e84040" transform="translate(14,-2) scale(0.8)"/>
