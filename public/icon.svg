  <path d="M342 175 L353 150 L364 175Z" fill="#f0c040"/>
  <circle cx="353" cy="148" r="5" fill="#f0c040"/>

  <!-- Main building body -->
  <rect x="160" y="210" width="192" height="120" rx="4" fill="#d4a017"/>
  
  <!-- Arch door -->
  <path d="M228 330 L228 272 Q256 248 284 272 L284 330Z" fill="#1a472a"/>
  
  <!-- Windows -->
  <path d="M178 240 L178 270 Q191 258 204 270 L204 240Z" fill="#1a472a"/>
  <path d="M308 240 L308 270 Q321 258 334 270 L334 240Z" fill="#1a472a"/>

